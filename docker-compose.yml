name: devonthego

services:
  traefik:
    image: traefik:v3.3
    container_name: dotg-traefik
    restart: unless-stopped
    command:
      - --log.level=INFO
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=devonthego
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - devonthego

  registry:
    image: registry:2
    container_name: dotg-registry
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - devonthego

  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: dotg-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - platform-data:/app/data
      - env-workspaces:/data/workspaces
    networks:
      - devonthego
    depends_on:
      - registry
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.platform.rule=Host(`admin.${DOMAIN}`)
      - traefik.http.routers.platform.entrypoints=websecure
      - traefik.http.routers.platform.tls.certresolver=letsencrypt
      - traefik.http.services.platform.loadbalancer.server.port=3333

networks:
  devonthego:
    name: devonthego

volumes:
  traefik-certs:
  registry-data:
  platform-data:
  env-workspaces:
